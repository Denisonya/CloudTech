<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Service</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        <section class="card">
            <p class="label">CloudTech</p>
            <h1>Заметки</h1>

            <form id="note-form">
                <label for="note-text">Новая заметка</label>
                <div class="form-row">
                    <input
                        id="note-text"
                        name="text"
                        type="text"
                        maxlength="500"
                        placeholder="Например: подготовить README"
                        required
                    >
                    <button type="submit">Добавить</button>
                </div>
                <p id="message" class="message"></p>
            </form>
        </section>

        <section class="card">
            <div class="section-header">
                <h2>Сохраненные записи</h2>
                <button id="refresh-button" class="secondary" type="button">
                    Обновить
                </button>
            </div>

            <ul id="notes-list" class="notes-list"></ul>
            <p id="empty-state" class="empty-state">
                Пока записей нет.
            </p>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
