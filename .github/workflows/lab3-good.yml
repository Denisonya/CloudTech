name: Lab3 - Good pipeline

on:
  push:
    branches:
      - lab3
    paths:
      - ".github/workflows/lab3-good.yml"
      - "lab2/**"
      - "lab3/check.sh"
      - "lab3/docker-compose.test.yml"
      - "lab3/requirements-dev.txt"
      - "lab3/pyproject.toml"
      - "lab3/tests/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: |
            lab2/requirements.txt
            lab3/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r lab3/requirements-dev.txt

      - name: Lint and test
        run: bash lab3/check.sh

  build:
    # Сборка запускается только после успешного прохождения lint и тестов.
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build backend image
        run: docker build -f backend/Dockerfile_good -t "notes-backend:$GITHUB_SHA" .
        working-directory: lab2

      - name: Build frontend image
        run: docker build -f nginx/Dockerfile -t "notes-frontend:$GITHUB_SHA" .
        working-directory: lab2

      - name: Show built images
        run: docker image ls --filter reference='notes-*'
